# Bonsai on NGP, production: the same services as compose.ngp.dev.yml,
# without what only serves development (source mounts, hot reloading,
# frontend_js, debug mounts). The api and frontend run their images' own
# commands. Values compose.yml overrode are kept as comments, marked
# "overridden".
#
# usage, from the repository root (or use the Makefile with NGP_ENV=prod):
#   podman-compose --in-pod=false --env-file compose.ngp.prod.env -f compose.ngp.prod.yml up -d
#   podman-compose --in-pod=false --env-file compose.ngp.prod.env -f compose.ngp.prod.yml down
#
# Header of docker-compose.yml:
# usage:
# (sudo) docker-compose up -d
# (sudo) docker-compose down
#
# Header of compose.yml:
# This file contains the changes we make to the original docker-compose.yml,
# with some exceptions such as disabling the 'bonsai-net' network, and removing a port-expose on the API.

# Include the original docker-compose.yml file from the Bonsai git-repository.
# Disabled since this breaks overriding the "commmand" block for services
#   🐞 https://github.com/containers/podman-compose/issues/1392
# include:
#   env_file: compose.ngp.prod.env
# #  - docker-compose.yml

services:
  mongodb:
    image: mongo:4.4.22
    container_name: bonsai_mongodb
#    ports:
#      - "27017:27017"
#    expose:
#      - "27017"
    networks:
      - bonsai-net
    volumes:
      #- ../data/mongodb:/data/db:z
      - "${DATA_ROOT:?DATA_ROOT must be set in the compose env file}/mongodb:/data/db:z"

  redis:
    container_name: redis
    image: redis:7.0.10
    networks:
      - bonsai-net

  api:
    image: localhost/bonsai-api:prod
    container_name: api
    build:
      context: api
      network: host
    userns_mode: "keep-id:uid=1001,gid=1001"
    user: "1001:1001"
    depends_on:
      - mongodb
      - minhash_service
      - ska_service
      - allele_cluster_service
      - hci_hcp_service
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/"]
      interval: 10s
      retries: 3
      start_period: 30s
      timeout: 10s
    env_file:
      - "${ENV_ROOT:?ENV_ROOT must be set in the compose env file}/api.env"
    environment:
      # - ALLOWED_ORIGINS=["*"]  # docker-compose.yml's value, overridden
      - ALLOWED_ORIGINS=[]  # empty for the NGP deployment
      - DB_HOST=mongodb
      - HCP_UPLOAD_ENABLED=true
      - HCP_UPLOAD_TIMEOUT=60
      - HCI_CREDENTIALS_PATH=/run/secret/hci_hcp_credentials.json
    networks:
      - bonsai-net
    # no command: the image's own is used (uvicorn without --reload, see api/Dockerfile)
    volumes:
      #- "${DATA_ROOT}/api/genome_signatures:/data/signature_db:U,z"
      - "${DATA_ROOT:?DATA_ROOT must be set in the compose env file}/tmp/reference_genomes:/tmp/reference_genomes:U,z"
      - "${DATA_ROOT:?DATA_ROOT must be set in the compose env file}/tmp/annotations:/tmp/annotations:U,z"
      #- /ngp_appstorage_remapped/GMC-joint:/ngp/appstorage/bonsai/GMC-joint:ro
      - "${CRED_ROOT:?CRED_ROOT must be set in the compose env file}/${HCI_HCP_CREDENTIALS_FILE:?HCI_HCP_CREDENTIALS_FILE must be set in the compose env file}:/run/secret/hci_hcp_credentials.json:ro,z"

  frontend:
    image: localhost/bonsai-frontend:prod
    container_name: frontend
    build:
      context: frontend
      network: host
    userns_mode: "keep-id:uid=1001,gid=1001"
    user: "1001:1001"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    ports:
      - "8000:5000"
    env_file:
      - "${ENV_ROOT:?ENV_ROOT must be set in the compose env file}/frontend.env"
    environment:
      - FLASK_APP=bonsai_app.app:create_app
      - FLASK_ENV=development
      - TZ=Europe/Stockholm
      - HCI_CREDENTIALS_PATH=/run/secret/hci_hcp_credentials.json
      - TESTING=True
    networks:
      - bonsai-net
    # command: "flask run --reload --debug --host 0.0.0.0"  # docker-compose.yml's command, overridden
    command: null # Overrides the command in 'docker-compose.yml' which starts a dev server.
    volumes:
      - "${CRED_ROOT:?CRED_ROOT must be set in the compose env file}/${HCI_HCP_CREDENTIALS_FILE:?HCI_HCP_CREDENTIALS_FILE must be set in the compose env file}:/run/secret/hci_hcp_credentials.json:ro,z"

  # todo: test ldap test

  minhash_service:
    image: localhost/bonsai-minhash-service:prod
    container_name: minhash_service
    build:
      context: minhash_service
      network: host
    #environment:
    #  GENOME_SIGNATURE_DIR: "${DATA_ROOT}/signature_db"
    userns_mode: keep-id
    user: "1001:1001"
    restart: on-failure
    depends_on:
      - redis
    networks:
      - bonsai-net
    volumes:
      - "${DATA_ROOT:?DATA_ROOT must be set in the compose env file}/signature_db:/data/signature_db:U,z"
    #  - /data/rclone-copy-test:/data/rclone-copy-test:U,z

  ska_service:
    image: localhost/bonsai-ska-service:prod
    container_name: ska_service
    build:
      context: ska_service
      network: host
    userns_mode: keep-id
    user: "1001:1001"
    restart: on-failure
    environment:
      - log_level=debug
    depends_on:
      - redis
    networks:
      - bonsai-net
    volumes:
      #- ../data/index_files:/data/index_files:U,z
      - "${DATA_ROOT:?DATA_ROOT must be set in the compose env file}/jasen-data/index_files:/data/index_files:U,z"
      #- /srv/bonsai/hcp-jasen-data/data/jasen_1.2.0/IONTORRENT_REALRUN/saureus/ska:/data/index_files/ska:U,z
      # rclone copy dest test

  allele_cluster_service:
    image: localhost/bonsai-allele-cluster-service:prod
    container_name: allele_cluster_service
    build:
      context: allele_cluster_service
      network: host
    restart: on-failure
    depends_on:
      - redis
    networks:
      - bonsai-net

  hci_hcp_service:
    image: localhost/bonsai-hci-hcp-service:prod
    userns_mode: "keep-id:uid=1001,gid=1001"
    user: "1001:1001"
    container_name: hci_hcp_service
    build:
      context: hci_hcp_service
      network: host
    environment:
      - HCP_CREDS_CONTAINER=/run/secret/hci_hcp_credentials.json
    env_file:
      - "${ENV_ROOT:?ENV_ROOT must be set in the compose env file}/hci_hcp.env"
    restart: on-failure
    volumes:
      #- "${CRED_ROOT}/hci_hcp_credentials.json:/run/secret/hci_hcp_credentials.json:U,Z,ro"
      - "${CRED_ROOT:?CRED_ROOT must be set in the compose env file}/${HCI_HCP_CREDENTIALS_FILE:?HCI_HCP_CREDENTIALS_FILE must be set in the compose env file}:/run/secret/hci_hcp_credentials.json:ro,z"
    depends_on:
      - redis
    networks:
      - bonsai-net

  dr_jan_itor:
    image: localhost/bonsai-api:prod
    container_name: dr_jan_itor
    logging:
      driver: k8s-file
      options:
        max-size: "10m"
    build:
      context: api
      network: host
    restart: on-failure
    depends_on:
      - mongodb
      - redis
      # api:
      #   condition: service_healthy
      #   restart: true
    # ports:
    #   - "8002:8000"
    env_file:
      - "${ENV_ROOT:?ENV_ROOT must be set in the compose env file}/api.env"
    environment:
      - PYTHONUNBUFFERED=
      - HCI_CREDENTIALS_PATH=/run/secret/hci_hcp_credentials.json  # required by the API's settings; not mounted, never read here
      - DB_HOST=mongodb
      - CACHE_CLEANUP_LOG_LEVEL=INFO  # DEBUG for more detail
    networks:
      - bonsai-net
    command: "bonsai_api cleanup-cache"

networks:
  bonsai-net:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.0.20.0/24

